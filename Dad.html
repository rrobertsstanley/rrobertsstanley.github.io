<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBAT Directions & Distances Trainer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f0f1e;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;}
#app{background:#00008B;color:#D8D8B4;border:2px solid #5050A0;display:flex;flex-direction:column;width:700px;min-height:650px;box-shadow:0 0 60px rgba(0,0,160,0.5);}
#titlebar{background:#000066;border-bottom:2px solid #5050A0;text-align:center;padding:9px 16px;font-size:13px;font-weight:700;letter-spacing:4px;color:#E0E0B8;text-transform:uppercase;}

/* MENU */
#screen-start{display:flex;flex-direction:column;flex:1;padding:22px 34px;gap:0;}
#menu-title{font-size:21px;font-weight:700;color:#E8E8C0;letter-spacing:2px;text-align:center;margin-bottom:5px;}
#menu-sub{font-size:11px;color:#6060A0;text-align:center;margin-bottom:18px;letter-spacing:0.5px;}
.mode-row{display:flex;gap:8px;margin-bottom:14px;}
.mode-btn{flex:1;padding:7px 4px;background:#000055;border:2px solid #3838A0;color:#8080C0;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;border-radius:2px;transition:all 0.15s;}
.mode-btn.active{background:#181880;border-color:#7070C0;color:#D8D8FF;}
.mode-btn:hover{border-color:#5050B0;color:#C0C0F0;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:1;margin-bottom:14px;align-content:start;}
.cat-card{background:#000060;border:1px solid #282888;border-radius:3px;padding:9px 11px;cursor:pointer;transition:all 0.15s;display:flex;align-items:flex-start;gap:9px;}
.cat-card:hover{border-color:#4848B0;background:#00006A;}
.cat-card.on{border-color:#5858D0;background:#08087A;}
.cat-check{width:15px;height:15px;border:2px solid #4040A0;border-radius:2px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#80FF80;}
.cat-card.on .cat-check{background:#1858A0;border-color:#6090FF;}
.cat-name{font-size:11px;font-weight:700;color:#B0B0D8;letter-spacing:0.5px;margin-bottom:2px;}
.cat-desc{font-size:10px;color:#505080;line-height:1.4;}
.start-row{display:flex;gap:10px;}
.big-btn{background:#787890;color:#000048;border:2px solid #5858A0;padding:10px 28px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:3px;transition:all 0.15s;}
.big-btn:hover{background:#B8B898;}
.big-btn.primary{flex:1;}
.big-btn.secondary{padding:10px 14px;font-size:11px;}

/* GAME */
#screen-game{display:none;flex-direction:column;flex:1;padding:16px 26px;gap:9px;}
#hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6060A0;font-weight:600;letter-spacing:0.5px;}
#progress-wrap{background:#000050;height:5px;border-radius:3px;overflow:hidden;}
#progress-bar{height:100%;background:#5050C0;border-radius:3px;transition:width 0.4s;}
#q-type-tag{font-size:9px;color:#383870;text-align:center;letter-spacing:1.5px;text-transform:uppercase;}
#scenario-box{background:#C8C870;color:#000055;border:2px solid #989830;border-radius:3px;padding:13px 18px;font-size:13px;line-height:1.75;font-weight:500;text-align:center;min-height:88px;display:flex;align-items:center;justify-content:center;}
#question-text{color:#D0D0B8;font-size:13.5px;text-align:center;font-weight:700;padding:2px 0;}
#options{display:flex;flex-direction:column;gap:7px;align-items:center;}
.opt{display:flex;align-items:center;gap:11px;background:none;border:none;cursor:pointer;color:#C0C0A0;font-family:inherit;font-size:13px;width:340px;text-align:left;padding:2px 0;transition:color 0.1s;}
.opt-key{background:#686880;color:#000048;border:2px solid #484868;width:27px;height:25px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;border-radius:2px;transition:all 0.1s;}
.opt:hover .opt-key{background:#A8A880;}
.opt:hover{color:#E0E0C0;}
.opt.correct .opt-key{background:#288038;color:#fff;border-color:#185820;}
.opt.wrong .opt-key{background:#A82020;color:#fff;border-color:#781010;}
.opt.reveal .opt-key{background:#288038;color:#fff;border-color:#185820;}
.opt.correct .opt-label{color:#70FF70;}
.opt.wrong .opt-label{color:#FF6060;}
.opt.reveal .opt-label{color:#70FF70;}
#feedback{text-align:center;font-size:12px;min-height:18px;font-weight:600;}
#footer{background:#000060;border-top:2px solid #5050A0;padding:7px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
#footer-hint{font-size:10px;color:#404070;}
#next-btn{background:#787890;color:#000048;border:2px solid #5858A0;padding:4px 18px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;border-radius:3px;display:none;}
#next-btn:hover{background:#A8A890;}

/* END */
#screen-end{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;padding:24px;}
#end-title{font-size:17px;font-weight:700;color:#E0E0B8;letter-spacing:2px;}
#end-score{font-size:50px;font-weight:700;color:#FFFF70;line-height:1;}
#end-grade{font-size:14px;font-weight:700;color:#B8B850;letter-spacing:2px;text-transform:uppercase;}
#end-stats{font-size:12px;color:#606080;text-align:center;line-height:2.2;}
#end-breakdown{font-size:11px;color:#404068;text-align:center;line-height:2;margin-top:2px;max-width:440px;}
.end-btns{display:flex;gap:10px;margin-top:6px;}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">Directions &amp; Distances — CBAT Trainer</div>

  <div id="screen-start">
    <div id="menu-title">CBAT Practice Trainer</div>
    <div id="menu-sub">Australian Aviation Security Screening Program · Advanced Mode</div>
    <div class="mode-row">
      <button class="mode-btn active" id="mode-all" onclick="setMode('all')">All Questions</button>
      <button class="mode-btn" id="mode-custom" onclick="setMode('custom')">Custom</button>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="start-row">
      <button class="big-btn secondary" onclick="setMode('all')">Reset</button>
      <button class="big-btn primary" onclick="startGame()">&#9654;&nbsp; Start Test</button>
    </div>
  </div>

  <div id="screen-game">
    <div id="hud"><span id="q-counter">Q 1/10</span><span id="score-live">Score: 0</span><span id="timer-live">0s</span></div>
    <div id="progress-wrap"><div id="progress-bar" style="width:10%"></div></div>
    <div id="q-type-tag"></div>
    <div id="scenario-box"></div>
    <div id="question-text"></div>
    <div id="options"></div>
    <div id="feedback">&nbsp;</div>
  </div>

  <div id="screen-end">
    <div id="end-title">Round Complete</div>
    <div id="end-score"></div>
    <div id="end-grade"></div>
    <div id="end-stats"></div>
    <div id="end-breakdown"></div>
    <div class="end-btns">
      <button class="big-btn secondary" onclick="showMenu()">&#8592; Menu</button>
      <button class="big-btn primary" onclick="startGame()">&#9654;&nbsp; Try Again</button>
    </div>
  </div>

  <div id="footer">
    <span id="footer-hint">Keys 1–4 to answer · Enter / Space for next</span>
    <button id="next-btn" onclick="nextQ()">Next &#9658;</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// CORE CONSTANTS
// ═══════════════════════════════════════════════════════
const CN={N:'North',S:'South',E:'East',W:'West',NE:'Northeast',NW:'Northwest',SE:'Southeast',SW:'Southwest'};
const OPP={N:'S',S:'N',E:'W',W:'E',NE:'SW',NW:'SE',SE:'NW',SW:'NE'};
const DV={N:{x:0,y:1},S:{x:0,y:-1},E:{x:1,y:0},W:{x:-1,y:0},NE:{x:1,y:1},NW:{x:-1,y:1},SE:{x:1,y:-1},SW:{x:-1,y:-1}};
const C4=['N','S','E','W'];
const C8=['N','S','E','W','NE','NW','SE','SW'];
// Adjacent compass points for plausible wrong answers
const ADJ={
  N:['NE','NW','S'],S:['SE','SW','N'],E:['NE','SE','W'],W:['NW','SW','E'],
  NE:['N','E','SW'],NW:['N','W','SE'],SE:['S','E','NW'],SW:['S','W','NE']
};
const PYTH=[[300,400,500],[600,800,1000],[500,1200,1300],[900,1200,1500]];
const PLACES=['cinema','supermarket','swimming pool','library','hospital','school','post office','train station','park','fire station','police station','town hall','sports centre','bus depot','marina','museum','clock tower','football ground','courthouse','lighthouse','airport','water tower','shopping centre','cathedral','fuel depot','naval base','radio tower','refinery'];
const VESSELS=['boat','ship','ferry','trawler','patrol boat','fishing vessel','cargo ship'];
const AIRCRAFT=['aircraft','helicopter','drone','light plane'];
const VEHICLES=['car','truck','van','motorcycle'];
const MOVERS=[...VESSELS,...AIRCRAFT,...VEHICLES];
const TOWNS=['Northfield','Southgate','Eastbrook','Westholm','Riverside','Lakeside','Hillcrest','Bayview','Clearwater','Thornton'];

// ═══════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickN(a,n){let b=[...a],r=[];for(let i=0;i<n;i++){let j=Math.floor(Math.random()*b.length);r.push(b.splice(j,1)[0]);}return r;}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// Random step value
function rS(lo,hi,step){
  step=step||100;
  let c=Math.floor((hi-lo)/step);
  if(c<1)c=1;
  return lo+step*(1+Math.floor(Math.random()*c));
}

function fmt(n){
  n=Math.round(n/100)*100;
  if(n<=0)return'0m';
  return n>=1000?(n/1000)+'km':n+'m';
}
function dn(d){return CN[d];}
function opp(d){return OPP[d];}

// Vector direction from components
function vd(px,py){
  if(px===0&&py===0)return null;
  if(px===0)return py>0?'N':'S';
  if(py===0)return px>0?'E':'W';
  if(px>0&&py>0)return'NE';if(px<0&&py>0)return'NW';
  if(px>0&&py<0)return'SE';return'SW';
}

// Distance between two points
function dist(ax,ay,bx,by){
  return Math.sqrt((ax-bx)**2+(ay-by)**2);
}

// Round to nearest 100
function r100(n){return Math.round(n/100)*100;}

// Build direction choices: correct + adjacent (plausible traps)
function buildDC(correct,pool){
  pool=pool||C8;
  let adj=(ADJ[correct]||[]).filter(d=>pool.includes(d));
  let others=[];
  for(let d of adj){if(!others.includes(d))others.push(d);}
  let rest=shuffle(pool.filter(d=>d!==correct&&!others.includes(d)));
  others=[...others,...rest];
  others=others.slice(0,3);
  while(others.length<3){
    let d=pick(C8);
    if(d!==correct&&!others.includes(d))others.push(d);
  }
  let ch=shuffle([dn(correct),...others.map(dn)]);
  return{ch,ci:ch.indexOf(dn(correct))};
}

// Build distance choices: correct + close wrong answers
function buildDistC(correctM,wrongs){
  correctM=r100(correctM);
  if(correctM<=0)return null;
  let cf=fmt(correctM);
  let pool=[cf];
  let candidates=wrongs.map(w=>r100(Math.abs(w))).filter(w=>w>0);
  // Also add ±100, ±200 variants
  candidates.push(correctM+100,correctM+200,correctM-100,correctM-200,correctM*2,r100(correctM*1.5));
  for(let w of candidates){
    if(w<=0)continue;
    let f=fmt(w);
    if(f!==cf&&!pool.includes(f))pool.push(f);
    if(pool.length>=4)break;
  }
  let att=0;
  while(pool.length<4&&att<60){att++;let w=rS(100,2000);let f=fmt(w);if(!pool.includes(f))pool.push(f);}
  pool=shuffle(pool.slice(0,4));
  let ci=pool.indexOf(cf);
  if(ci<0)return null;
  return{ch:pool,ci};
}

// Build named choices (places/vessels etc)
function buildNameC(correct,wrongArr){
  let others=wrongArr.filter(x=>x!==correct).slice(0,3);
  while(others.length<3){
    let p=pick(PLACES);
    if(p!==correct&&!others.includes(p))others.push(p);
  }
  let ch=shuffle([correct,...others]);
  return{ch,ci:ch.indexOf(correct)};
}

function Q(s,q,ch,ci,cat){
  if(!ch||ch.length!==4||ci<0||ci>=4)return null;
  return{s,q,choices:ch,correct:ci,cat};
}

// ═══════════════════════════════════════════════════════
// TURN MAPS
// ═══════════════════════════════════════════════════════
const TURN_R90={N:'E',E:'S',S:'W',W:'N',NE:'SE',SE:'SW',SW:'NW',NW:'NE'};
const TURN_L90={N:'W',W:'S',S:'E',E:'N',NE:'NW',NW:'SW',SW:'SE',SE:'NE'};
const TURN_180={N:'S',S:'N',E:'W',W:'E',NE:'SW',SW:'NE',NW:'SE',SE:'NW'};
const TURN_R45={N:'NE',NE:'E',E:'SE',SE:'S',S:'SW',SW:'W',W:'NW',NW:'N'};
const TURN_L45={N:'NW',NW:'W',W:'SW',SW:'S',S:'SE',SE:'E',E:'NE',NE:'N'};

function applyTurn(dir,turn){
  const maps={R90:TURN_R90,L90:TURN_L90,T180:TURN_180,R45:TURN_R45,L45:TURN_L45};
  return maps[turn]?maps[turn][dir]:null;
}

// ═══════════════════════════════════════════════════════
// ── CAT 1: MULTI-STEP CHAINS (≥4 locations) ──────────
// ═══════════════════════════════════════════════════════

function genChain4(){
  for(let t=0;t<40;t++){
    const [A,B,C,D,E]=pickN(PLACES,5);
    const dirs=[pick(C4),pick(C4),pick(C4),pick(C4)];
    const rs=[rS(200,700),rS(200,700),rS(200,700),rS(200,700)];
    let px=0,py=0;
    for(let i=0;i<4;i++){px+=DV[dirs[i]].x*rs[i];py+=DV[dirs[i]].y*rs[i];}
    const c=vd(px,py);if(!c)continue;
    const pool=(px===0||py===0)?C4:C8;
    const{ch,ci}=buildDC(c,pool);
    return Q(
      `The ${A} is ${fmt(rs[0])} ${dn(dirs[0])} of the ${B}. The ${B} is ${fmt(rs[1])} ${dn(dirs[1])} of the ${C}. The ${C} is ${fmt(rs[2])} ${dn(dirs[2])} of the ${D}. The ${D} is ${fmt(rs[3])} ${dn(dirs[3])} of the ${E}.`,
      `What direction is the ${A} from the ${E}?`,ch,ci,'chain');
  }return null;
}

function genChain4Inter(){
  for(let t=0;t<40;t++){
    const [A,B,C,D,E]=pickN(PLACES,5);
    const dirs=[pick(C8),pick(C4),pick(C8),pick(C4)];
    const rs=[rS(200,600,200),rS(200,600),rS(200,600,200),rS(200,600)];
    let px=0,py=0;
    for(let i=0;i<4;i++){px+=DV[dirs[i]].x*rs[i];py+=DV[dirs[i]].y*rs[i];}
    const c=vd(px,py);if(!c)continue;
    const{ch,ci}=buildDC(c,C8);
    return Q(
      `The ${A} is ${fmt(rs[0])} ${dn(dirs[0])} of the ${B}. The ${B} is ${fmt(rs[1])} ${dn(dirs[1])} of the ${C}. The ${C} is ${fmt(rs[2])} ${dn(dirs[2])} of the ${D}. The ${D} is ${fmt(rs[3])} ${dn(dirs[3])} of the ${E}.`,
      `What direction is the ${A} from the ${E}?`,ch,ci,'chain');
  }return null;
}

function genChainReverse4(){
  for(let t=0;t<40;t++){
    const [A,B,C,D,E]=pickN(PLACES,5);
    const dirs=[pick(C4),pick(C4),pick(C4),pick(C4)];
    const rs=[rS(200,700),rS(200,700),rS(200,700),rS(200,700)];
    let px=0,py=0;
    for(let i=0;i<4;i++){px+=DV[dirs[i]].x*rs[i];py+=DV[dirs[i]].y*rs[i];}
    const fwd=vd(px,py);if(!fwd)continue;
    const rev=opp(fwd);
    const{ch,ci}=buildDC(rev,C8);
    return Q(
      `The ${A} is ${fmt(rs[0])} ${dn(dirs[0])} of the ${B}. The ${B} is ${fmt(rs[1])} ${dn(dirs[1])} of the ${C}. The ${C} is ${fmt(rs[2])} ${dn(dirs[2])} of the ${D}. The ${D} is ${fmt(rs[3])} ${dn(dirs[3])} of the ${E}.`,
      `What direction is the ${E} from the ${A}?`,ch,ci,'chain');
  }return null;
}

// Ask direction between non-adjacent pair in a 5-location chain
function genSubChain(){
  for(let t=0;t<40;t++){
    const [A,B,C,D,E]=pickN(PLACES,5);
    const dirs=[pick(C4),pick(C4),pick(C4),pick(C4)];
    const rs=[rS(200,700),rS(200,700),rS(200,700),rS(200,700)];
    // Ask direction B from D (sub-chain is B→C→D, reversed = D from B)
    const px=DV[dirs[1]].x*rs[1]+DV[dirs[2]].x*rs[2];
    const py=DV[dirs[1]].y*rs[1]+DV[dirs[2]].y*rs[2];
    const fwd=vd(px,py);if(!fwd)continue;
    const rev=opp(fwd); // D from B
    const pool=(px===0||py===0)?C4:C8;
    const{ch,ci}=buildDC(rev,pool);
    return Q(
      `The ${A} is ${fmt(rs[0])} ${dn(dirs[0])} of the ${B}. The ${B} is ${fmt(rs[1])} ${dn(dirs[1])} of the ${C}. The ${C} is ${fmt(rs[2])} ${dn(dirs[2])} of the ${D}. The ${D} is ${fmt(rs[3])} ${dn(dirs[3])} of the ${E}.`,
      `What direction is the ${D} from the ${B}? (not from ${A} or ${E})`,ch,ci,'chain');
  }return null;
}

// Chain with 2 planted decoys
function genDecoyChain(){
  for(let t=0;t<40;t++){
    const [A,B,C,D,E,X,Y]=pickN(PLACES,7);
    const dirs=[pick(C4),pick(C4),pick(C4)];
    const rs=[rS(300,700),rS(300,700),rS(300,700)];
    let px=0,py=0;
    for(let i=0;i<3;i++){px+=DV[dirs[i]].x*rs[i];py+=DV[dirs[i]].y*rs[i];}
    const c=vd(px,py);if(!c)continue;
    const{ch,ci}=buildDC(c,C8);
    const dX=pick(C4),dY=pick(C4);
    return Q(
      `The ${A} is ${fmt(rs[0])} ${dn(dirs[0])} of the ${B}. The ${X} is ${fmt(rS(200,500))} ${dn(dX)} of the ${B}. The ${B} is ${fmt(rs[1])} ${dn(dirs[1])} of the ${C}. The ${Y} is ${fmt(rS(200,500))} ${dn(dY)} of the ${C}. The ${C} is ${fmt(rs[2])} ${dn(dirs[2])} of the ${D}.`,
      `What direction is the ${A} from the ${D}? (${X} and ${Y} are irrelevant)`,ch,ci,'chain');
  }return null;
}

// ═══════════════════════════════════════════════════════
// ── CAT 2: TWO OBJECTS MOVING ─────────────────────────
// ═══════════════════════════════════════════════════════

function genTwoVesselsDir(){
  for(let t=0;t<40;t++){
    const [v1,v2]=pickN(MOVERS,2);
    const d1=pick(C8),d2=pick(C8.filter(x=>x!==d1));
    const r1=rS(400,1000,200),r2=rS(400,1000,200);
    const p1x=DV[d1].x*r1,p1y=DV[d1].y*r1;
    const p2x=DV[d2].x*r2,p2y=DV[d2].y*r2;
    const relx=p1x-p2x,rely=p1y-p2y;
    const c=vd(relx,rely);if(!c)continue;
    const{ch,ci}=buildDC(c,C8);
    return Q(
      `A ${v1} and a ${v2} depart from the same point simultaneously. The ${v1} travels ${fmt(r1)} ${dn(d1)}. The ${v2} travels ${fmt(r2)} ${dn(d2)}.`,
      `What direction is the ${v1} from the ${v2} at the end?`,ch,ci,'relative');
  }return null;
}

// Two vessels, each with 2 legs, ask direction between endpoints
function genTwoVessels2Leg(){
  for(let t=0;t<40;t++){
    const [v1,v2]=pickN(MOVERS,2);
    const d1a=pick(C4),d1b=pick(C4.filter(x=>x!==d1a&&x!==opp(d1a)));
    const d2a=pick(C4),d2b=pick(C4.filter(x=>x!==d2a&&x!==opp(d2a)));
    const r1a=rS(300,700),r1b=rS(300,700),r2a=rS(300,700),r2b=rS(300,700);
    const p1x=DV[d1a].x*r1a+DV[d1b].x*r1b;
    const p1y=DV[d1a].y*r1a+DV[d1b].y*r1b;
    const p2x=DV[d2a].x*r2a+DV[d2b].x*r2b;
    const p2y=DV[d2a].y*r2a+DV[d2b].y*r2b;
    const relx=p1x-p2x,rely=p1y-p2y;
    const c=vd(relx,rely);if(!c)continue;
    const{ch,ci}=buildDC(c,C8);
    return Q(
      `Two vessels leave the same port. The ${v1} travels ${fmt(r1a)} ${dn(d1a)} then ${fmt(r1b)} ${dn(d1b)}. The ${v2} travels ${fmt(r2a)} ${dn(d2a)} then ${fmt(r2b)} ${dn(d2b)}.`,
      `At the end of their journeys, what direction is the ${v1} from the ${v2}?`,ch,ci,'relative');
  }return null;
}

function genTwoVesselsFurther(){
  for(let t=0;t<40;t++){

// Core: compute journey endpoint vs landmark, ask closer/further
function genLandmarkCloserFurther(){
  for(let t=0;t<40;t++){
    const v=pick(MOVERS);
    const town=pick(TOWNS);
    const lmDir=pick(C4);
    const lmDist=rS(800,1800,200); // landmark distance from start
    const lmX=DV[lmDir].x*lmDist,lmY=DV[lmDir].y*lmDist;
    // Multi-leg journey (3 legs)
    const d1=pick(C8),d2=pick(C8.filter(x=>x!==opp(d1))),d3=pick(C8.filter(x=>x!==opp(d2)));
    const r1=rS(300,700,200),r2=rS(300,700,200),r3=rS(300,700,200);
    const ex=DV[d1].x*r1+DV[d2].x*r2+DV[d3].x*r3;
    const ey=DV[d1].y*r1+DV[d2].y*r2+DV[d3].y*r3;
    const distStart=dist(0,0,lmX,lmY);
    const distEnd=dist(ex,ey,lmX,lmY);
    if(Math.abs(distStart-distEnd)<100)continue; // too close to call
    const correct=distEnd<distStart?'Closer to it':'Further from it';
    const choices=shuffle(['Closer to it','Further from it','The same distance from it','Cannot be determined']);
    const ci=choices.indexOf(correct);if(ci<0)continue;
    return Q(
      `${town} is ${fmt(lmDist)} ${dn(lmDir)} of the starting point. A ${v} travels ${fmt(r1)} ${dn(d1)}, then ${fmt(r2)} ${dn(d2)}, then ${fmt(r3)} ${dn(d3)}.`,
      `Is the ${v} now closer to or further from ${town} than when it started?`,choices,ci,'landmark');
  }return null;
}

// Ask which side of the landmark (N/S/E/W of it) after journey
function genLandmarkWhichSide(){
  for(let t=0;t<40;t++){

    const ex=DV[d1].x*r1+DV[d2].x*r2+DV[d3].x*r3;
    const ey=DV[d1].y*r1+DV[d2].y*r2+DV[d3].y*r3;
    // Direction of landmark from endpoint
    const relX=lmX-ex,relY=lmY-ey;
    const c=vd(relX,relY);if(!c)continue;
    const{ch,ci}=buildDC(c,C8);
    return Q(
      `${town} is ${fmt(lmDist)} ${dn(lmDir)} of the starting point. A ${v} travels ${fmt(r1)} ${dn(d1)}, then ${fmt(r2)} ${dn(d2)}, then ${fmt(r3)} ${dn(d3)}.`,
      `At the end of the journey, in what direction is ${town} from the ${v}?`,ch,ci,'landmark');
  }return null;

// Ask distance from landmark after journey
function genLandmarkHowFar(){
  for(let t=0;t<40;t++){
    const v=pick(MOVERS);
    const town=pick(TOWNS);
    // Use simple geometry so answer is clean
    const lmDir=pick(C4);
    const lmDist=rS(600,1400,200);
    const lmX=DV[lmDir].x*lmDist,lmY=DV[lmDir].y*lmDist;
    // Journey: move toward or partly toward landmark then perpendicular
    const tri=pick(PYTH);
    const towardDist=tri[0];
    const perpDist=tri[1];
    const finalDist=tri[2];
    const perpD=pick(C4.filter(x=>x!==lmDir&&x!==opp(lmDir)));
    const d1=lmDir,d2=perpD;
    const r1=lmDist-towardDist>0?lmDist-towardDist:towardDist; // arrive near landmark
    // Actually: journey such that endpoint is exactly tri[0] N and tri[1] E of landmark
    // endpoint at (lmX+tri[0]*DV[perpD].x, lmY+tri[0]*DV[perpD].y)?
    // Simpler: landmark at (0,lmDist) from start. Journey ends at (tri[1]*DV[perpD].x, lmDist-tri[0])
    const ex2=DV[perpD].x*tri[1];
    const ey2=lmDist-tri[0];
    const actualDist=r100(Math.sqrt((ex2-lmX)**2+(ey2-lmY)**2));
    if(actualDist!==tri[2])continue;
    const dc=buildDistC(finalDist,[towardDist,perpDist,lmDist,finalDist+100]);
    if(!dc)continue;
    return Q(
      `${town} is ${fmt(lmDist)} ${dn(lmDir)} of the starting point. A ${v} travels ${fmt(tri[0])} toward ${town}, then turns and travels ${fmt(tri[1])} ${dn(perpD)}.`,
      `How far is the ${v} now from ${town}? (to nearest 100m)`,dc.ch,dc.ci,'landmark');
  }return null;
}

// "Did you pass it / overshoot"
function genPassedOrNot(){
  for(let t=0;t<40;t++){
    const v=pick(MOVERS);
    const town=pick(TOWNS);
    const d=pick(C4);
    const lmDist=rS(600,1400,200);
    // Multi-leg: first leg toward landmark, second leg same direction further, third leg perpendicular
    const r1=rS(200,lmDist-100); // stop before town
    const r2extra=rS(100,600,100); // overshoot past town
    const r2=lmDist-r1+r2extra; // total past town
    const r3=rS(200,500);
    const perpD=pick(C4.filter(x=>x!==d&&x!==opp(d)));
    // Final NS position
    const finalMain=DV[d].y*(r1+r2)+DV[perpD].y*r3;
    const lmMain=DV[d].y*lmDist;
    const overshot=Math.abs(finalMain)>Math.abs(lmMain)&&Math.sign(finalMain)===Math.sign(lmMain);
    const correct=overshot?'Yes, it has passed it':'No, it has not reached it yet';
    const choices=shuffle(['Yes, it has passed it','No, it has not reached it yet',`It is level with ${town}`,'Cannot be determined']);
    const ci=choices.indexOf(correct);if(ci<0)continue;
    return Q(
      `${town} is ${fmt(lmDist)} ${dn(d)} of the starting point. A ${v} travels ${fmt(r1)} ${dn(d)}, then ${fmt(r2)} ${dn(d)}, then ${fmt(r3)} ${dn(perpD)}.`,
      `Has the ${v} passed ${town}?`,choices,ci,'landmark');
  }return null;
}

// Closer to A or B landmark
function genCloserToWhichTown(){
  for(let t=0;t<40;t++){
    const v=pick(MOVERS);
    const [townA,townB]=pickN(TOWNS,2);
    const dA=pick(C4),dB=pick(C4.filter(x=>x!==dA));
    const rA=rS(600,1400,200),rB=rS(600,1400,200);
    const lmAx=DV[dA].x*rA,lmAy=DV[dA].y*rA;
    const lmBx=DV[dB].x*rB,lmBy=DV[dB].y*rB;
    // 3-leg journey
    const d1=pick(C4),d2=pick(C4.filter(x=>x!==opp(d1))),d3=pick(C4);
    const r1=rS(300,700),r2=rS(300,700),r3=rS(300,700);
    const ex=DV[d1].x*r1+DV[d2].x*r2+DV[d3].x*r3;
    const ey=DV[d1].y*r1+DV[d2].y*r2+DV[d3].y*r3;
    const dToA=dist(ex,ey,lmAx,lmAy);
    const dToB=dist(ex,ey,lmBx,lmBy);
    if(Math.abs(dToA-dToB)<150)continue;
    const correct=dToA<dToB?townA:townB;
    const choices=shuffle([townA,townB,`They are equidistant`,'Cannot be determined']);
    const ci=choices.indexOf(correct);if(ci<0)continue;
    return Q(
      `${townA} is ${fmt(rA)} ${dn(dA)} of the starting point. ${townB} is ${fmt(rB)} ${dn(dB)} of the starting point. A ${v} travels ${fmt(r1)} ${dn(d1)}, then ${fmt(r2)} ${dn(d2)}, then ${fmt(r3)} ${dn(d3)}.`,
      `At the end of the journey, is the ${v} closer to ${townA} or ${townB}?`,choices,ci,'landmark');
  }return null;
}

function genOrderingNS(){
  const places=pickN(PLACES,4);
  const pos=places.map((_,i)=>(i+1)*300);
  const shuffled=shuffle(places.map((p,i)=>({p,pos:pos[i]})));
  const sents=[];
  for(let i=0;i<shuffled.length-1;i++){
    const gap=shuffled[i+1].pos-shuffled[i].pos;
    sents.push(`The ${shuffled[i].p} is ${fmt(gap)} South of the ${shuffled[i+1].p}.`);
  }
  const askType=pick(['most northerly','most southerly']);
  const sorted=shuffled.slice().sort((a,b)=>b.pos-a.pos);
  const correct=askType==='most northerly'?sorted[0].p:sorted[sorted.length-1].p;
  const{ch,ci}=buildNameC(correct,places.filter(p=>p!==correct));
  return Q(shuffle(sents).join(' '),`Which location is the ${askType}?`,ch,ci,'ordering');
}

function genLayeredRelative(){
  for(let t=0;t<40;t++){
    const [A,B,C,D]=pickN(PLACES,4);
    // Assign grid positions
    const ax=rS(-600,600,200),ay=rS(-600,600,200);
    const bx=rS(-600,600,200),by=rS(-600,600,200);
    const cx=rS(-600,600,200),cy=rS(-600,600,200);
    const dx=rS(-600,600,200),dy=rS(-600,600,200);
    if(ax===bx||ay===by||cx===dx||cy===dy)continue;
    const sents=[];
    // A vs B (NS)
    if(ay>by)sents.push(`The ${A} is ${fmt(Math.abs(ay-by))} North of the ${B}.`);
    else sents.push(`The ${A} is ${fmt(Math.abs(ay-by))} South of the ${B}.`);
    // C vs B (NS) and D
    if(cy>by&&cy<ay)sents.push(`The ${C} is South of the ${A} but North of the ${B}.`);
    else if(cy<by)sents.push(`The ${C} is ${fmt(Math.abs(cy-by))} South of the ${B}.`);
    else sents.push(`The ${C} is ${fmt(Math.abs(cy-ay))} North of the ${A}.`);
    // D vs C (EW)
    if(dx>cx)sents.push(`The ${D} is ${fmt(Math.abs(dx-cx))} East of the ${C}.`);
    else sents.push(`The ${D} is ${fmt(Math.abs(dx-cx))} West of the ${C}.`);
    const askType=pick(['most northerly','most southerly','most easterly','most westerly']);
    const all=[{p:A,x:ax,y:ay},{p:B,x:bx,y:by},{p:C,x:cx,y:cy},{p:D,x:dx,y:dy}];
    let correct;
    if(askType==='most northerly')correct=all.reduce((a,b)=>a.y>b.y?a:b).p;
    else if(askType==='most southerly')correct=all.reduce((a,b)=>a.y<b.y?a:b).p;
    else if(askType==='most easterly')correct=all.reduce((a,b)=>a.x>b.x?a:b).p;
    else correct=all.reduce((a,b)=>a.x<b.x?a:b).p;
    const{ch,ci}=buildNameC(correct,[A,B,C,D].filter(p=>p!==correct));
    if(ci<0)continue;
    return Q(shuffle(sents).join(' '),`Which location is the ${askType}?`,ch,ci,'ordering');
  }return null;
}

function genFurthestInDir(){
  const [ref,A,B,C,D]=pickN(PLACES,5);
  const mainD=pick(C4);
  const perpD=pick(C4.filter(x=>x!==mainD&&x!==opp(mainD)));
  const rA=rS(800,1500);
  const rB=rS(100,rA-200),rC=rS(100,rA-200),rD=rS(100,rA-200);
  const s=`The ${A} is ${fmt(rA)} ${dn(mainD)} of the ${ref}. The ${B} is ${fmt(rB)} ${dn(perpD)} of the ${ref}. The ${C} is ${fmt(rC)} ${dn(opp(mainD))} of the ${ref}. The ${D} is ${fmt(rD)} ${dn(opp(perpD))} of the ${ref}.`;
  const chs=shuffle([A,B,C,D]);
  return Q(s,`Which location is furthest ${dn(mainD)}?`,chs,chs.indexOf(A),'ordering');
}

// Opposite directions - verified correct
function genDistOpposite(){
  const [A,B,C]=pickN(PLACES,3);
  const d=pick(C4);
  const r1=rS(300,900),r2=rS(300,900);
  const total=r1+r2;
  const dc=buildDistC(total,[Math.abs(r1-r2),r1,r2,total+100]);
  if(!dc)return null;
  return Q(`The ${A} is ${fmt(r1)} ${dn(d)} of the ${B}. The ${C} is ${fmt(r2)} ${dn(opp(d))} of the ${B}.`,
    `How far is the ${A} from the ${C}?`,dc.ch,dc.ci,'distance');
}

// Same direction - gap = r2 - r1 (verified)
function genDistSameDir(){
  const [A,B,C]=pickN(PLACES,3);
  const d=pick(C4);
  const r1=rS(300,700);
  const extra=rS(200,600);
  const r2=r1+extra; // C is further than A in same direction
  const gap=r2-r1; // distance from A to C
  const dc=buildDistC(gap,[r1,r2,r1+r2,gap+100]);
  if(!dc)return null;
  return Q(
    `The ${A} is ${fmt(r1)} ${dn(d)} of the ${B}. The ${C} is ${fmt(r2)} ${dn(d)} of the ${B}.`,
    `How far is the ${A} from the ${C}?`,dc.ch,dc.ci,'distance');
}

// Three in a line - A and C measured from B same direction
function genDistThreeInLine(){
  const [A,B,C]=pickN(PLACES,3);
  const d=pick(C4);
  const r1=rS(300,800); // A is r1 from B
  const extra=rS(200,600);
  const r2=r1+extra; // C is r2 from B in same direction
  const gap=r2-r1; // A to C distance
  const dc=buildDistC(gap,[r1,r2,r1+r2,gap+200]);
  if(!dc)return null;
  return Q(
    `The ${A} is ${fmt(r1)} ${dn(d)} of the ${B}. The ${C} is ${fmt(r2)} ${dn(d)} of the ${B}.`,
    `How far is the ${A} from the ${C}?`,dc.ch,dc.ci,'distance');
}

// Pythagorean - uses exact triples only
function genDistDiag(){
  const [A,B,C]=pickN(PLACES,3);
  const d1=pick(C4),d2=pick(C4.filter(x=>x!==d1&&x!==opp(d1)));
  const tri=pick(PYTH);
  const dc=buildDistC(tri[2],[tri[0]+tri[1],Math.abs(tri[0]-tri[1]),Math.max(tri[0],tri[1]),tri[2]+100]);
  if(!dc)return null;
  return Q(
    `The ${A} is ${fmt(tri[0])} ${dn(d1)} of the ${B}. The ${C} is ${fmt(tri[1])} ${dn(d2)} of the ${B}.`,
    `How far is the ${A} from the ${C}? (to nearest 100m)`,dc.ch,dc.ci,'distance');
}

// Chain with decoy: A is r1 d of B; B is r2 opp(d) of D → A to D = r1+r2; C is decoy
function genDistChainDecoy(){
  const [A,B,C,D]=pickN(PLACES,4);
  const d=pick(C4);
  const r1=rS(300,700),r2=rS(300,700);
  const total=r1+r2; // A is r1 d of B, D is r2 opp(d) of B → A to D = r1+r2
  const decoyD=pick(C4.filter(x=>x!==d&&x!==opp(d)));
  const rDecoy=rS(300,700);
  const dc=buildDistC(total,[r1,r2,Math.abs(r1-r2),total+rDecoy]);
  if(!dc)return null;
  return Q(
    `The ${A} is ${fmt(r1)} ${dn(d)} of the ${B}. The ${C} is ${fmt(rDecoy)} ${dn(decoyD)} of the ${B}. The ${D} is ${fmt(r2)} ${dn(opp(d))} of the ${B}.`,
    `How far is the ${A} from the ${D}? (ignore the ${C})`,dc.ch,dc.ci,'distance');
}

// MENU
// ═══════════════════════════════════════════════════════
let currentMode='all';

function setMode(mode){
  currentMode=mode;
  document.getElementById('mode-all').classList.toggle('active',mode==='all');
  document.getElementById('mode-custom').classList.toggle('active',mode==='custom');
  if(mode==='all'){CATEGORIES.forEach(c=>c.enabled=true);renderCats();}
}

function renderCats(){
  const grid=document.getElementById('cat-grid');grid.innerHTML='';
  CATEGORIES.forEach((cat,i)=>{
    const card=document.createElement('div');
    card.className='cat-card'+(cat.enabled?' on':'');
    card.onclick=()=>toggleCat(i);
    card.innerHTML=`<div class="cat-check">${cat.enabled?'✓':''}</div><div class="cat-info"><div class="cat-name">${cat.label}</div><div class="cat-desc">${cat.desc}</div></div>`;
    grid.appendChild(card);
  });
}

function toggleCat(i){
  currentMode='custom';
  document.getElementById('mode-all').classList.remove('active');
  document.getElementById('mode-custom').classList.add('active');
  CATEGORIES[i].enabled=!CATEGORIES[i].enabled;
  renderCats();
}

renderCats();

// ═══════════════════════════════════════════════════════
// QUESTION GENERATION
// ═══════════════════════════════════════════════════════
function makeQ(){
  const enabled=CATEGORIES.filter(c=>c.enabled);
  if(!enabled.length)return null;
  const allGens=[];
  for(const cat of enabled){
    for(const[g,w]of cat.gens)allGens.push({g,w,id:cat.id,label:cat.label});
  }
  const total=allGens.reduce((a,b)=>a+b.w,0);
  for(let attempt=0;attempt<80;attempt++){
    let r=Math.random()*total,chosen=allGens[0];
    for(const item of allGens){r-=item.w;if(r<=0){chosen=item;break;}}
    try{
      const q=chosen.g();
      if(q&&q.correct>=0&&q.correct<4&&q.choices.length===4){
        q.catLabel=chosen.label;q.catId=chosen.id;return q;
      }
    }catch(e){}
  }
  return null;
}

// ═══════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════
let qs=[],qi=0,score=0,answered=false,times=[],catResults={},qStart=0,gameStart=0,tInt=null;

function startGame(){
  const enabled=CATEGORIES.filter(c=>c.enabled);
  if(!enabled.length){alert('Please enable at least one question category.');return;}
  qs=[];
  let attempts=0;
  while(qs.length<10&&attempts<300){attempts++;const q=makeQ();if(q)qs.push(q);}
  if(qs.length<5){alert('Could not generate enough questions. Try enabling more categories.');return;}
  qi=0;score=0;answered=false;times=[];
  CATEGORIES.forEach(c=>{catResults[c.id]={correct:0,total:0,label:c.label};});
  document.getElementById('screen-start').style.display='none';
  document.getElementById('screen-end').style.display='none';
  document.getElementById('screen-game').style.display='flex';
  gameStart=Date.now();showQ();
}

function showMenu(){
  document.getElementById('screen-game').style.display='none';
  document.getElementById('screen-end').style.display='none';
  document.getElementById('screen-start').style.display='flex';
}

function showQ(){
  answered=false;qStart=Date.now();
  clearInterval(tInt);
  tInt=setInterval(()=>{document.getElementById('timer-live').textContent=Math.round((Date.now()-qStart)/1000)+'s';},400);
  const q=qs[qi];
  document.getElementById('q-counter').textContent=`Q ${qi+1}/${qs.length}`;
  document.getElementById('score-live').textContent=`Score: ${score}`;
  document.getElementById('progress-bar').style.width=`${((qi+1)/qs.length)*100}%`;
  document.getElementById('q-type-tag').textContent=q.catLabel||'';
  document.getElementById('scenario-box').textContent=q.s;
  document.getElementById('question-text').textContent=q.q;
  document.getElementById('feedback').innerHTML='&nbsp;';
  document.getElementById('next-btn').style.display='none';
  const opts=document.getElementById('options');opts.innerHTML='';
  q.choices.forEach((c,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="opt-key">${i+1}</span><span class="opt-label">${c}</span>`;
    b.onclick=()=>answer(i);opts.appendChild(b);
  });
}

function answer(idx){
  if(answered)return;answered=true;clearInterval(tInt);
  times.push((Date.now()-qStart)/1000);
  const q=qs[qi];
  if(q.catId&&catResults[q.catId]){catResults[q.catId].total++;}
  const btns=document.querySelectorAll('.opt');
  if(idx===q.correct){
    btns[idx].classList.add('correct');
    document.getElementById('feedback').innerHTML='<span style="color:#70FF70">✓ Correct!</span>';
    score++;
    if(q.catId&&catResults[q.catId])catResults[q.catId].correct++;
  }else{
    btns[idx].classList.add('wrong');
    if(btns[q.correct])btns[q.correct].classList.add('reveal');
    document.getElementById('feedback').innerHTML=`<span style="color:#FF6060">✗ Incorrect — answer: ${q.choices[q.correct]}</span>`;
  }
  document.getElementById('score-live').textContent=`Score: ${score}`;
  document.getElementById('next-btn').style.display='block';
}

function nextQ(){qi++;if(qi>=qs.length){endGame();return;}showQ();}

function endGame(){
  clearInterval(tInt);
  document.getElementById('screen-game').style.display='none';
  document.getElementById('screen-end').style.display='flex';
  const avg=times.length?(times.reduce((a,b)=>a+b,0)/times.length).toFixed(1):'—';
  const total=((Date.now()-gameStart)/1000).toFixed(0);
  const pct=Math.round(score/qs.length*100);
  const grade=pct>=90?'PASS — Excellent':pct>=70?'PASS — Good':pct>=50?'BORDERLINE':'FAIL — Keep practising';
  document.getElementById('end-score').textContent=`${score} / ${qs.length}`;
  document.getElementById('end-grade').textContent=grade;
  document.getElementById('end-stats').innerHTML=`Avg time per question: ${avg}s &nbsp;|&nbsp; Total: ${total}s<br>Accuracy: ${pct}%`;
  const breakdown=Object.entries(catResults)
    .filter(([,v])=>v.total>0)
    .map(([,v])=>`${v.label}: ${v.correct}/${v.total}`)
    .join(' &nbsp;·&nbsp; ');
  document.getElementById('end-breakdown').innerHTML=breakdown;
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('screen-game').style.display!=='flex')return;
  const n=parseInt(e.key);
  if(n>=1&&n<=4&&!answered)answer(n-1);
  if((e.key==='Enter'||e.key===' ')&&answered)nextQ();
});
