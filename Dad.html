<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBAT Directions & Distances Trainer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;}
#app{background:#00008B;color:#D8D8B4;border:2px solid #5050A0;display:flex;flex-direction:column;width:680px;min-height:640px;box-shadow:0 0 40px rgba(0,0,140,0.6);}
#titlebar{background:#000066;border-bottom:2px solid #5050A0;text-align:center;padding:9px 16px;font-size:13px;font-weight:700;letter-spacing:4px;color:#E0E0B8;text-transform:uppercase;}

/* ── MENU ── */
#screen-start{display:flex;flex-direction:column;flex:1;padding:24px 36px;gap:0;}
#menu-title{font-size:22px;font-weight:700;color:#E8E8C0;letter-spacing:2px;text-align:center;margin-bottom:6px;}
#menu-sub{font-size:12px;color:#7070A0;text-align:center;margin-bottom:20px;letter-spacing:0.5px;}
.mode-row{display:flex;gap:10px;margin-bottom:16px;}
.mode-btn{flex:1;padding:8px 4px;background:#000055;border:2px solid #4040A0;color:#A0A0C0;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;border-radius:2px;transition:all 0.15s;}
.mode-btn.active{background:#202080;border-color:#8080C0;color:#E0E0FF;}
.mode-btn:hover{border-color:#6060B0;color:#D0D0F0;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;margin-bottom:16px;}
.cat-card{background:#000060;border:1px solid #303090;border-radius:3px;padding:10px 12px;cursor:pointer;transition:all 0.15s;display:flex;align-items:flex-start;gap:10px;}
.cat-card:hover{border-color:#5050B0;background:#000070;}
.cat-card.on{border-color:#6060D0;background:#0a0a80;}
.cat-check{width:16px;height:16px;border:2px solid #5050A0;border-radius:2px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#80FF80;transition:all 0.15s;}
.cat-card.on .cat-check{background:#2060A0;border-color:#80A0FF;}
.cat-info{}
.cat-name{font-size:12px;font-weight:700;color:#C0C0E0;letter-spacing:0.5px;margin-bottom:2px;}
.cat-desc{font-size:11px;color:#6060A0;line-height:1.4;}
.start-row{display:flex;gap:10px;}
.big-btn{background:#808098;color:#000050;border:2px solid #6060A0;padding:10px 32px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:3px;transition:all 0.15s;}
.big-btn:hover{background:#C0C098;}
.big-btn.primary{flex:1;}
.big-btn.secondary{padding:10px 16px;font-size:12px;}

/* ── GAME ── */
#screen-game{display:none;flex-direction:column;flex:1;padding:18px 28px;gap:10px;}
#hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#7070A0;font-weight:600;letter-spacing:0.5px;}
#progress-wrap{background:#000055;height:5px;border-radius:3px;overflow:hidden;}
#progress-bar{height:100%;background:#5858C0;border-radius:3px;transition:width 0.4s;}
#q-type-tag{font-size:10px;color:#404080;text-align:center;letter-spacing:1px;text-transform:uppercase;margin-bottom:-4px;}
#scenario-box{background:#C8C870;color:#000055;border:2px solid #A0A040;border-radius:3px;padding:14px 20px;font-size:13.5px;line-height:1.75;font-weight:500;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;}
#question-text{color:#D8D8C0;font-size:14px;text-align:center;font-weight:700;padding:4px 0;}
#options{display:flex;flex-direction:column;gap:8px;align-items:center;}
.opt{display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;color:#C8C8A8;font-family:inherit;font-size:13.5px;width:340px;text-align:left;padding:3px 0;transition:color 0.1s;}
.opt-key{background:#707088;color:#000050;border:2px solid #505070;width:28px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;border-radius:2px;transition:all 0.1s;}
.opt:hover .opt-key{background:#B0B088;}
.opt:hover{color:#E0E0C0;}
.opt.correct .opt-key{background:#2A9040;color:#fff;border-color:#1A6030;}
.opt.wrong .opt-key{background:#B02828;color:#fff;border-color:#801818;}
.opt.reveal .opt-key{background:#2A9040;color:#fff;border-color:#1A6030;}
.opt.correct .opt-label{color:#80FF80;}
.opt.wrong .opt-label{color:#FF7070;}
.opt.reveal .opt-label{color:#80FF80;}
#feedback{text-align:center;font-size:13px;min-height:20px;font-weight:600;}
#footer{background:#000066;border-top:2px solid #5050A0;padding:8px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
#footer-hint{font-size:11px;color:#505080;}
#next-btn{background:#808098;color:#000050;border:2px solid #6060A0;padding:5px 20px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:3px;display:none;}
#next-btn:hover{background:#B0B090;}

/* ── END ── */
#screen-end{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;padding:24px;}
#end-title{font-size:18px;font-weight:700;color:#E8E8C0;letter-spacing:2px;}
#end-score{font-size:52px;font-weight:700;color:#FFFF80;line-height:1;}
#end-grade{font-size:15px;font-weight:700;color:#C0C060;letter-spacing:2px;text-transform:uppercase;}
#end-stats{font-size:12px;color:#7070A0;text-align:center;line-height:2.2;}
#end-breakdown{font-size:11px;color:#505080;text-align:center;line-height:1.9;margin-top:4px;max-width:400px;}
.end-btns{display:flex;gap:10px;margin-top:8px;}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">Directions &amp; Distances — CBAT Trainer</div>

  <!-- MENU -->
  <div id="screen-start">
    <div id="menu-title">CBAT Practice Trainer</div>
    <div id="menu-sub">Australian Aviation Security Screening Program</div>
    <div class="mode-row">
      <button class="mode-btn active" id="mode-all" onclick="setMode('all')">All Questions</button>
      <button class="mode-btn" id="mode-custom" onclick="setMode('custom')">Custom</button>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="start-row">
      <button class="big-btn secondary" onclick="setMode('all')">Reset</button>
      <button class="big-btn primary" onclick="startGame()">&#9654;&nbsp; Start Test</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="screen-game">
    <div id="hud"><span id="q-counter">Q 1/10</span><span id="score-live">Score: 0</span><span id="timer-live">0s</span></div>
    <div id="progress-wrap"><div id="progress-bar" style="width:10%"></div></div>
    <div id="q-type-tag"></div>
    <div id="scenario-box"></div>
    <div id="question-text"></div>
    <div id="options"></div>
    <div id="feedback">&nbsp;</div>
  </div>

  <!-- END -->
  <div id="screen-end">
    <div id="end-title">Round Complete</div>
    <div id="end-score"></div>
    <div id="end-grade"></div>
    <div id="end-stats"></div>
    <div id="end-breakdown"></div>
    <div class="end-btns">
      <button class="big-btn secondary" onclick="showMenu()">&#8592; Menu</button>
      <button class="big-btn primary" onclick="startGame()">&#9654;&nbsp; Try Again</button>
    </div>
  </div>

  <div id="footer">
    <span id="footer-hint">Keys 1–4 · Enter/Space for next</span>
    <button id="next-btn" onclick="nextQ()">Next &#9658;</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════
const CN={N:'North',S:'South',E:'East',W:'West',NE:'Northeast',NW:'Northwest',SE:'Southeast',SW:'Southwest'};
const OPP={N:'S',S:'N',E:'W',W:'E',NE:'SW',NW:'SE',SE:'NW',SW:'NE'};
const DV={N:{x:0,y:1},S:{x:0,y:-1},E:{x:1,y:0},W:{x:-1,y:0},NE:{x:1,y:1},NW:{x:-1,y:1},SE:{x:1,y:-1},SW:{x:-1,y:-1}};
const C4=['N','S','E','W'];
const C8=['N','S','E','W','NE','NW','SE','SW'];
// Adjacent directions on compass for plausible wrong answers
const ADJ={N:['NE','NW','S'],S:['SE','SW','N'],E:['NE','SE','W'],W:['NW','SW','E'],NE:['N','E','NW'],NW:['N','W','NE'],SE:['S','E','SW'],SW:['S','W','SE']};
const PYTH=[[300,400,500],[600,800,1000],[500,1200,1300],[900,1200,1500]];
const PLACES=['cinema','supermarket','swimming pool','library','hospital','school','post office','train station','park','fire station','police station','town hall','sports centre','bus depot','marina','museum','clock tower','football ground','courthouse','lighthouse','airport','water tower','shopping centre','cathedral'];
const VESSELS=['boat','ship','ferry','trawler','submarine','cargo vessel','patrol boat','fishing boat'];
const AIRCRAFT=['aircraft','helicopter','drone','light plane','glider'];
const VEHICLES=['car','truck','van','cyclist','motorcycle'];
const PEOPLE=['pilot','navigator','officer','captain','driver','hiker'];

// ═══════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickN(a,n){let b=[...a],r=[];for(let i=0;i<n;i++){let j=Math.floor(Math.random()*b.length);r.push(b.splice(j,1)[0]);}return r;}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function rS(lo,hi,step){step=step||100;let c=Math.floor((hi-lo)/step);if(c<1)c=1;return lo+step*(1+Math.floor(Math.random()*c));}
function fmt(n){n=Math.round(n/100)*100;return n>=1000?(n/1000)+'km':n+'m';}
function dn(d){return CN[d];}
function opp(d){return OPP[d];}
function vd(px,py){
  if(px===0&&py===0)return null;
  if(px===0)return py>0?'N':'S';
  if(py===0)return px>0?'E':'W';
  if(px>0&&py>0)return'NE';if(px<0&&py>0)return'NW';
  if(px>0&&py<0)return'SE';return'SW';
}
function Q(s,q,ch,ci,cat){
  if(ci<0||ci>=ch.length)return null;
  return{s,q,choices:ch,correct:ci,cat};
}

// Build direction choices: correct + adjacent intercardinals (plausible traps)
function buildDC(correct,forcePool){
  const pool=forcePool||C8;
  let adj=ADJ[correct]||[];
  let others=[];
  // First add adjacent dirs that exist in pool
  for(let d of adj){if(pool.includes(d)&&!others.includes(d))others.push(d);}
  // Fill remaining from pool
  let rest=shuffle(pool.filter(d=>d!==correct&&!others.includes(d)));
  others=[...others,...rest];
  others=others.slice(0,3);
  let ch=shuffle([dn(correct),...others.map(dn)]);
  return{ch,ci:ch.indexOf(dn(correct))};
}

// Build distance choices: correct + believable near-misses
function buildDistC(correctM,wrongs){
  let cf=fmt(correctM);
  let pool=[cf];
  let candidates=[...wrongs,correctM-100,correctM+100,correctM+200,correctM-200,correctM*2,Math.round(correctM*1.5/100)*100];
  for(let w of candidates){
    if(w<=0)continue;
    let f=fmt(Math.round(w/100)*100);
    if(f!==cf&&!pool.includes(f))pool.push(f);
    if(pool.length>=4)break;
  }
  let attempts=0;
  while(pool.length<4&&attempts<60){attempts++;let w=rS(100,2000);let f=fmt(w);if(!pool.includes(f))pool.push(f);}
  pool=shuffle(pool.slice(0,4));
  return{ch:pool,ci:pool.indexOf(cf)};
}

// Build yes/no or named choices
function buildNameC(correct,others){
  let ch=shuffle([correct,...others.slice(0,3)]);
  return{ch,ci:ch.indexOf(correct)};
}

// ═══════════════════════════════════════════════════════════════════
// QUESTION CATEGORIES
// ═══════════════════════════════════════════════════════════════════

// ── CAT A: Multi-step chain logic ────────────────────────────────
function genChain3(){
  for(let t=0;t<30;t++){
    const [A,B,C,D]=pickN(PLACES,4);
    const d1=pick(C4),d2=pick(C4.filter(x=>x!==opp(d1))),d3=pick(C4.filter(x=>x!==opp(d2)));
    const r1=rS(200,800),r2=rS(200,800),r3=rS(200,800);
    const px=DV[d1].x*r1+DV[d2].x*r2+DV[d3].x*r3;
    const py=DV[d1].y*r1+DV[d2].y*r2+DV[d3].y*r3;
    const c=vd(px,py);if(!c)continue;
    const pool=(px===0||py===0)?C4:C8;
    const{ch,ci}=buildDC(c,pool);
    return Q(`The ${A} is ${fmt(r1)} ${dn(d1)} of the ${B}. The ${B} is ${fmt(r2)} ${dn(d2)} of the ${C}. The ${C} is ${fmt(r3)} ${dn(d3)} of the ${D}.`,
      `What direction is the ${A} from the ${D}?`,ch,ci,'chain');
  }return null;
}

function genChain4(){
  for(let t=0;t<30;t++){
    const [A,B,C,D,E]=pickN(PLACES,5);
    const dirs=[pick(C4),pick(C4),pick(C4),pick(C4)];
    const rs=[rS(200,600),rS(200,600),rS(200,600),rS(200,600)];
    let px=0,py=0;
    for(let i=0;i<4;i++){px+=DV[dirs[i]].x*rs[i];py+=DV[dirs[i]].y*rs[i];}
    const c=vd(px,py);if(!c)continue;
    const pool=(px===0||py===0)?C4:C8;
    const{ch,ci}=buildDC(c,pool);
    return Q(
      `The ${A} is ${fmt(rs[0])} ${dn(dirs[0])} of the ${B}. The ${B} is ${fmt(rs[1])} ${dn(dirs[1])} of the ${C}. The ${C} is ${fmt(rs[2])} ${dn(dirs[2])} of the ${D}. The ${D} is ${fmt(rs[3])} ${dn(dirs[3])} of the ${E}.`,
      `What direction is the ${A} from the ${E}?`,ch,ci,'chain');
  }return null;
}

function genChain4Intercardinal(){
  for(let t=0;t<30;t++){
    const [A,B,C,D,E]=pickN(PLACES,5);
    const dirs=[pick(C8),pick(C8),pick(C4),pick(C8)];
    const rs=[rS(200,600,200),rS(200,600,200),rS(200,600),rS(200,600,200)];
    let px=0,py=0;
    for(let i=0;i<4;i++){px+=DV[dirs[i]].x*rs[i];py+=DV[dirs[i]].y*rs[i];}
    const c=vd(px,py);if(!c)continue;
    const{ch,ci}=buildDC(c,C8);
    return Q(
      `The ${A} is ${fmt(rs[0])} ${dn(dirs[0])} of the ${B}. The ${B} is ${fmt(rs[1])} ${dn(dirs[1])} of the ${C}. The ${C} is ${fmt(rs[2])} ${dn(dirs[2])} of the ${D}. The ${D} is ${fmt(rs[3])} ${dn(dirs[3])} of the ${E}.`,
      `What direction is the ${A} from the ${E}?`,ch,ci,'chain');
  }return null;
}

function genChainReverse(){
  for(let t=0;t<30;t++){
    const [A,B,C,D]=pickN(PLACES,4);
    const d1=pick(C4),d2=pick(C4.filter(x=>x!==opp(d1))),d3=pick(C4.filter(x=>x!==opp(d2)));
    const r1=rS(200,700),r2=rS(200,700),r3=rS(200,700);
    const px=DV[d1].x*r1+DV[d2].x*r2+DV[d3].x*r3;
    const py=DV[d1].y*r1+DV[d2].y*r2+DV[d3].y*r3;
    const fwd=vd(px,py);if(!fwd)continue;
    const rev=opp(fwd);
    const{ch,ci}=buildDC(rev,C8);
    return Q(`The ${A} is ${fmt(r1)} ${dn(d1)} of the ${B}. The ${B} is ${fmt(r2)} ${dn(d2)} of the ${C}. The ${C} is ${fmt(r3)} ${dn(d3)} of the ${D}.`,
      `What direction is the ${D} from the ${A}?`,ch,ci,'chain');
  }return null;
}

// Non-adjacent pair: given A→B→C→D, ask B from C (sub-chain)
function genSubChain(){
  for(let t=0;t<30;t++){
    const [A,B,C,D,E]=pickN(PLACES,5);
    const d1=pick(C4),d2=pick(C4.filter(x=>x!==opp(d1))),d3=pick(C4.filter(x=>x!==opp(d2))),d4=pick(C4.filter(x=>x!==opp(d3)));
    const r1=rS(200,700),r2=rS(200,700),r3=rS(200,700),r4=rS(200,700);
    // Ask direction of B from D (sub-chain B→C→D reversed)
    const px=-(DV[d2].x*r2+DV[d3].x*r3);
    const py=-(DV[d2].y*r2+DV[d3].y*r3);
    const c=vd(px,py);if(!c)continue;
    const pool=(px===0||py===0)?C4:C8;
    const{ch,ci}=buildDC(c,pool);
    return Q(
      `The ${A} is ${fmt(r1)} ${dn(d1)} of the ${B}. The ${B} is ${fmt(r2)} ${dn(d2)} of the ${C}. The ${C} is ${fmt(r3)} ${dn(d3)} of the ${D}. The ${D} is ${fmt(r4)} ${dn(d4)} of the ${E}.`,
      `What direction is the ${B} from the ${D}?`,ch,ci,'chain');
  }return null;
}

// Decoy: extra irrelevant locations scattered through scenario
function genDecoyChain(){
  for(let t=0;t<30;t++){
    const [A,B,C,D,X,Y]=pickN(PLACES,6);
    const d1=pick(C4),d2=pick(C4.filter(x=>x!==opp(d1))),d3=pick(C4.filter(x=>x!==opp(d2)));
    const r1=rS(300,700),r2=rS(300,700),r3=rS(300,700);
    const px=DV[d1].x*r1+DV[d2].x*r2+DV[d3].x*r3;
    const py=DV[d1].y*r1+DV[d2].y*r2+DV[d3].y*r3;
    const c=vd(px,py);if(!c)continue;
    const{ch,ci}=buildDC(c,C8);
    const dX=pick(C4),dY=pick(C4);
    return Q(
      `The ${A} is ${fmt(r1)} ${dn(d1)} of the ${B}. The ${X} is ${fmt(rS(200,500))} ${dn(dX)} of the ${B}. The ${B} is ${fmt(r2)} ${dn(d2)} of the ${C}. The ${Y} is ${fmt(rS(200,500))} ${dn(dY)} of the ${C}. The ${C} is ${fmt(r3)} ${dn(d3)} of the ${D}.`,
      `What direction is the ${A} from the ${D}? (not the ${X} or ${Y})`,ch,ci,'chain');
  }return null;
}

// ── CAT B: Two objects moving relative to each other ─────────────
function genTwoVesselsDirection(){
  for(let t=0;t<30;t++){
    const [v1,v2]=pickN([...VESSELS,...AIRCRAFT],2);
    const d1=pick(C8),d2=pick(C8.filter(x=>x!==d1));
    const r1=rS(400,1000,200),r2=rS(400,1000,200);
    const p1x=DV[d1].x*r1,p1y=DV[d1].y*r1;
    const p2x=DV[d2].x*r2,p2y=DV[d2].y*r2;
    const relx=p1x-p2x,rely=p1y-p2y;
    const c=vd(relx,rely);if(!c)continue;
    const{ch,ci}=buildDC(c,C8);
    return Q(
      `A ${v1} and a ${v2} depart from the same point. The ${v1} travels ${fmt(r1)} ${dn(d1)}. The ${v2} travels ${fmt(r2)} ${dn(d2)}.`,
      `What direction is the ${v1} from the ${v2}?`,ch,ci,'relative');
  }return null;
}

function genTwoVesselsFurther(){
  for(let t=0;t<30;t++){
    const [v1,v2]=pickN([...VESSELS,...AIRCRAFT],2);
    const mainD=pick(C4);
    const perpD=pick(C4.filter(x=>x!==mainD&&x!==opp(mainD)));
    const r1=rS(600,1200); // v1 goes straight mainD — clearly further
    const r2NS=rS(200,r1-200); // v2 goes mainD then swerves perpD
    const r2perp=rS(300,800);
    const choices=shuffle([`The ${v1}`,`The ${v2}`,`They are equal`,`Cannot be determined`]);
    const ci=choices.indexOf(`The ${v1}`);
    if(ci<0)continue;
    return Q(
      `A ${v1} travels ${fmt(r1)} ${dn(mainD)}. A ${v2} travels ${fmt(r2NS)} ${dn(mainD)}, then ${fmt(r2perp)} ${dn(perpD)}.`,
      `Which is further ${dn(mainD)} from the starting point?`,choices,ci,'relative');
  }return null;
}

function genTwoVesselsMeetingPoint(){
  for(let t=0;t<30;t++){
    const [v1,v2]=pickN(VESSELS,2);
    const d1=pick(C4),d2=pick(C4.filter(x=>x!==d1&&x!==opp(d1)));
    const r1=rS(400,1000),r2=rS(400,1000);
    // v1 starts at A goes d1, v2 starts at B (offset) goes d2 — ask relative direction
    const startOffsetDir=pick(C4);
    const startOffsetDist=rS(300,700);
    // v2 final relative to v1 final
    const p1x=DV[d1].x*r1,p1y=DV[d1].y*r1;
    const p2x=DV[startOffsetDir].x*startOffsetDist+DV[d2].x*r2;
    const p2y=DV[startOffsetDir].y*startOffsetDist+DV[d2].y*r2;
    const relx=p1x-p2x,rely=p1y-p2y;
    const c=vd(relx,rely);if(!c)continue;
    const{ch,ci}=buildDC(c,C8);
    return Q(
      `A ${v1} departs Point A heading ${dn(d1)} for ${fmt(r1)}. A ${v2} departs from ${fmt(startOffsetDist)} ${dn(startOffsetDir)} of Point A, heading ${dn(d2)} for ${fmt(r2)}.`,
      `What direction is the ${v1} from the ${v2} at the end?`,ch,ci,'relative');
  }return null;
}

function genClosingVessels(){

// ── CAT E: Ordering / Spatial logic ─────────────────────────────
function genOrderingNS(){
  // Give N/S relationships, ask which is most northerly / southerly
  const [A,B,C,D]=pickN(PLACES,4);
  const northmost=pick([A,B,C,D]);
  // Assign positions along N-S axis
  const order=shuffle([A,B,C,D]);
  const scores={};
  order.forEach((p,i)=>scores[p]=i*200+200);
  const sentences=[];
  for(let i=0;i<order.length-1;i++){
    sentences.push(`The ${order[i]} is ${fmt(scores[order[i+1]]-scores[order[i]])} North of the ${order[i+1]}.`);
  }
  // Scramble sentence order
  const s=shuffle(sentences).join(' ');
  const askMost=pick(['most northerly','most southerly']);
  const correct=askMost==='most northerly'?order[0]:order[order.length-1];
  const{ch,ci}=buildNameC(correct,[A,B,C,D].filter(x=>x!==correct).slice(0,3));
  return Q(s,`Which location is the ${askMost}?`,ch,ci,'ordering');
}

function genOrderingMixed(){
  const [A,B,C,D]=pickN(PLACES,4);
  const nsPositions={};
  const ewPositions={};
  [A,B,C,D].forEach(p=>{nsPositions[p]=rS(-800,800,200);ewPositions[p]=rS(-800,800,200);});
  const sentences=[];
  const pairs=[[A,B],[B,C],[C,D],[A,C]];
  for(const[p,q]of shuffle(pairs).slice(0,3)){
    const nsDiff=nsPositions[p]-nsPositions[q];
    const ewDiff=ewPositions[p]-ewPositions[q];
    if(Math.abs(nsDiff)>100){
      sentences.push(`The ${p} is ${fmt(Math.abs(nsDiff))} ${nsDiff>0?'North':'South'} of the ${q}.`);
    } else if(Math.abs(ewDiff)>100){
      sentences.push(`The ${p} is ${fmt(Math.abs(ewDiff))} ${ewDiff>0?'East':'West'} of the ${q}.`);
    }
  }
  if(sentences.length<2)return null;
  // Find easternmost
  const sorted=Object.entries(ewPositions).sort((a,b)=>b[1]-a[1]);
  const eastmost=sorted[0][0];
  const{ch,ci}=buildNameC(eastmost,[A,B,C,D].filter(x=>x!==eastmost).slice(0,3));
  return Q(shuffle(sentences).join(' '),`Which location is the most easterly?`,ch,ci,'ordering');
}

function genClosest(){

  const ref=places[0],others=places.slice(1);

  const assigned=shuffle(others).map((p,i)=>({p,d:dirs[i%4],dist:dists[i]}));
  const minDist=Math.min(...assigned.map(x=>x.dist));
  const correctName=assigned.find(x=>x.dist===minDist).p;
  const s=shuffle(assigned).map(x=>`The ${x.p} is ${fmt(x.dist)} ${dn(x.d)} of the ${ref}.`).join(' ');
  const chs=shuffle(assigned.map(x=>x.p));
  return Q(s,`Which location is closest to the ${ref}?`,chs,chs.indexOf(correctName),'ordering');
}

    id:'relative',label:'Two Objects Moving',
    desc:'Two vessels/aircraft depart same point. Relative direction & distance.',
    gens:[[genTwoVesselsDirection,4],[genTwoVesselsFurther,3],[genTwoVesselsMeetingPoint,3],[genClosingVessels,3],[genDivergingVessels,3]],
    enabled:true
  },
  {
    id:'heading',label:'Heading & Rotation',
    desc:'Turns, reversals, facing directions, and relative left/right.',
    gens:[[genHeadingTurn,3],[genHeadingMultiTurn,3],[genReturnHeading,3],[genFacingRelative,2],[genFacingBehind,2],[genPersonFacingWalk,2]],
    enabled:true
  },
  {
    id:'journey',label:'Journey Navigation',
    desc:'Multi-leg journeys. Where did you end up from start or landmark?',
    gens:[[genJourneyDir,3],[genJourney3Leg,3],[genJourneyReverse,3],[genJourneyBacktrack,3],[genJourneyFromLandmark,3],[genNetDisplacement,2]],
    enabled:true
  },
  {
    id:'ordering',label:'Spatial Ordering',
    desc:'Which is closest/furthest/most northerly given multiple positions.',
    gens:[[genOrderingNS,3],[genOrderingMixed,2],[genClosest,3],[genFurthestInDir,3]],
    enabled:true
  },
  {
    id:'distance',label:'Distance Calculation',
    desc:'How far between two points given partial distances. Includes Pythagoras.',
    gens:[[genDistOpposite,3],[genDistSameDir,3],[genDistDiag,2],[genDistChainDecoy,3],[genDistThreeInLine,3]],
    enabled:true
  },
  {
    id:'intersection',label:'Crossed Paths',
    desc:'Two roads intersect. Direction and distance between locations on different roads.',

// ═══════════════════════════════════════════════════════════════════
// MENU LOGIC
// ═══════════════════════════════════════════════════════════════════
let currentMode='all';

function setMode(mode){
  currentMode=mode;
  document.getElementById('mode-all').classList.toggle('active',mode==='all');
  document.getElementById('mode-custom').classList.toggle('active',mode==='custom');
  if(mode==='all'){
    CATEGORIES.forEach(c=>c.enabled=true);
    renderCats();
  }
}

function renderCats(){
  const grid=document.getElementById('cat-grid');
  grid.innerHTML='';
  CATEGORIES.forEach((cat,i)=>{
    const card=document.createElement('div');
    card.className='cat-card'+(cat.enabled?' on':'');
    card.onclick=()=>toggleCat(i);
    card.innerHTML=`<div class="cat-check">${cat.enabled?'✓':''}</div><div class="cat-info"><div class="cat-name">${cat.label}</div><div class="cat-desc">${cat.desc}</div></div>`;
    grid.appendChild(card);
  });
}

function toggleCat(i){
  currentMode='custom';
  document.getElementById('mode-all').classList.remove('active');
  document.getElementById('mode-custom').classList.add('active');
  CATEGORIES[i].enabled=!CATEGORIES[i].enabled;
  renderCats();
}

renderCats();

// ═══════════════════════════════════════════════════════════════════
// QUESTION GENERATION
// ═══════════════════════════════════════════════════════════════════
function makeQ(){
  const enabledCats=CATEGORIES.filter(c=>c.enabled);
  if(!enabledCats.length)return null;
  // Weighted pick across enabled categories
  const allGens=[];
  for(const cat of enabledCats){
    for(const[g,w]of cat.gens)allGens.push({g,w,cat:cat.id,label:cat.label});
  }
  const total=allGens.reduce((a,b)=>a+b.w,0);
  for(let attempt=0;attempt<60;attempt++){
    let r=Math.random()*total;
    let chosen=allGens[0];
    for(const item of allGens){r-=item.w;if(r<=0){chosen=item;break;}}
    try{
      const q=chosen.g();
      if(q&&q.correct>=0&&q.correct<q.choices.length&&q.choices.length===4){
        q.catLabel=chosen.label;
        return q;
      }
    }catch(e){}
  }
  return null;
}

// ═══════════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════════
let qs=[],qi=0,score=0,answered=false,times=[],catResults={},qStart=0,gameStart=0,tInt=null;

function startGame(){
  const enabledCats=CATEGORIES.filter(c=>c.enabled);
  if(!enabledCats.length){alert('Please enable at least one question category.');return;}
  qs=[];
  let attempts=0;
  while(qs.length<10&&attempts<200){attempts++;const q=makeQ();if(q)qs.push(q);}
  if(!qs.length){alert('Could not generate questions. Try enabling more categories.');return;}
  qi=0;score=0;answered=false;times=[];catResults={};
  CATEGORIES.forEach(c=>{catResults[c.id]={correct:0,total:0};});
  document.getElementById('screen-start').style.display='none';
  document.getElementById('screen-end').style.display='none';
  document.getElementById('screen-game').style.display='flex';
  gameStart=Date.now();
  showQ();
}

function showMenu(){
  document.getElementById('screen-game').style.display='none';
  document.getElementById('screen-end').style.display='none';
  document.getElementById('screen-start').style.display='flex';
}

function showQ(){
  answered=false;qStart=Date.now();
  clearInterval(tInt);
  tInt=setInterval(()=>{document.getElementById('timer-live').textContent=Math.round((Date.now()-qStart)/1000)+'s';},400);
  const q=qs[qi];
  document.getElementById('q-counter').textContent=`Q ${qi+1}/${qs.length}`;
  document.getElementById('score-live').textContent=`Score: ${score}`;
  document.getElementById('progress-bar').style.width=`${((qi+1)/qs.length)*100}%`;
  document.getElementById('q-type-tag').textContent=q.catLabel||'';
  document.getElementById('scenario-box').textContent=q.s;
  document.getElementById('question-text').textContent=q.q;
  document.getElementById('feedback').innerHTML='&nbsp;';
  document.getElementById('next-btn').style.display='none';
  const opts=document.getElementById('options');opts.innerHTML='';
  q.choices.forEach((c,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="opt-key">${i+1}</span><span class="opt-label">${c}</span>`;
    b.onclick=()=>answer(i);opts.appendChild(b);
  });
}

function answer(idx){
  if(answered)return;answered=true;clearInterval(tInt);
  const elapsed=(Date.now()-qStart)/1000;
  times.push(elapsed);
  const q=qs[qi];
  if(q.cat){catResults[q.cat]=catResults[q.cat]||{correct:0,total:0};catResults[q.cat].total++;}
  const btns=document.querySelectorAll('.opt');
  if(idx===q.correct){
    btns[idx].classList.add('correct');
    document.getElementById('feedback').innerHTML='<span style="color:#80FF80">✓ Correct!</span>';
    score++;
    if(q.cat)catResults[q.cat].correct++;
  }else{
    btns[idx].classList.add('wrong');
    if(btns[q.correct])btns[q.correct].classList.add('reveal');
    document.getElementById('feedback').innerHTML=`<span style="color:#FF7070">✗ Incorrect — answer: ${q.choices[q.correct]}</span>`;
  }
  document.getElementById('score-live').textContent=`Score: ${score}`;
  document.getElementById('next-btn').style.display='block';
}

function nextQ(){qi++;if(qi>=qs.length){endGame();return;}showQ();}

function endGame(){
  clearInterval(tInt);
  document.getElementById('screen-game').style.display='none';
  document.getElementById('screen-end').style.display='flex';
  const avg=times.length?(times.reduce((a,b)=>a+b,0)/times.length).toFixed(1):'—';
  const total=((Date.now()-gameStart)/1000).toFixed(0);
  const pct=Math.round(score/qs.length*100);
  const grade=pct>=90?'PASS — Excellent':pct>=70?'PASS — Good':pct>=50?'BORDERLINE':'FAIL — Keep practising';
  document.getElementById('end-score').textContent=`${score} / ${qs.length}`;
  document.getElementById('end-grade').textContent=grade;
  document.getElementById('end-stats').innerHTML=`Avg time per question: ${avg}s &nbsp;|&nbsp; Total: ${total}s<br>Accuracy: ${pct}%`;
  const breakdown=Object.entries(catResults)
    .filter(([,v])=>v.total>0)
    .map(([k,v])=>{const cat=CATEGORIES.find(c=>c.id===k);return`${cat?cat.label:k}: ${v.correct}/${v.total}`;})
    .join(' &nbsp;·&nbsp; ');
  document.getElementById('end-breakdown').innerHTML=breakdown;
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('screen-game').style.display!=='flex')return;
  const n=parseInt(e.key);
  if(n>=1&&n<=4&&!answered)answer(n-1);
  if((e.key==='Enter'||e.key===' ')&&answered)nextQ();
});
</script>
